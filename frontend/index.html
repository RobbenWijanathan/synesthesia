<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Synesthesia</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Synesthesia</h1>

  <section id="upload-section">
    <input type="file" id="fileInput" accept="audio/*" />
    <button id="uploadBtn">Upload &amp; Separate</button>
    <p id="status">Choose a song to begin.</p>
  </section>

  <section id="player-section" hidden>
    <div id="visualizer-grid">
      <div class="stem-panel">
        <div class="panel-header">
          <span class="stem-label">Vocals</span>
          <span class="chaos-value" data-stem="vocals">0</span>
          <select class="visual-select" data-stem="vocals"></select>
        </div>
        <canvas class="stem-canvas" data-stem="vocals" width="380" height="220"></canvas>
      </div>

      <div class="stem-panel">
        <div class="panel-header">
          <span class="stem-label">Drums</span>
          <span class="chaos-value" data-stem="drums">0</span>
          <select class="visual-select" data-stem="drums"></select>
        </div>
        <canvas class="stem-canvas" data-stem="drums" width="380" height="220"></canvas>
      </div>

      <div class="stem-panel">
        <div class="panel-header">
          <span class="stem-label">Bass</span>
          <span class="chaos-value" data-stem="bass">0</span>
          <select class="visual-select" data-stem="bass"></select>
        </div>
        <canvas class="stem-canvas" data-stem="bass" width="380" height="220"></canvas>
      </div>

      <div class="stem-panel">
        <div class="panel-header">
          <span class="stem-label">Other</span>
          <span class="chaos-value" data-stem="other">0</span>
          <select class="visual-select" data-stem="other"></select>
        </div>
        <canvas class="stem-canvas" data-stem="other" width="380" height="220"></canvas>
      </div>
    </div>

    <div id="transport">
      <button id="playPauseBtn">Play</button>
      <input type="range" id="seekBar" min="0" max="100" value="0" step="0.1" />
      <span id="timeDisplay">0:00 / 0:00</span>
    </div>
  </section>

  <!-- Hidden audio elements, one per stem. src is set by script.js once
       the backend finishes separation. -->
  <audio id="audio-vocals" preload="auto"></audio>
  <audio id="audio-drums" preload="auto"></audio>
  <audio id="audio-bass" preload="auto"></audio>
  <audio id="audio-other" preload="auto"></audio>

  <!-- Load order matters — no bundler yet, just globals:
       visualizers.js defines VISUALIZER_TYPES,
       glitchfx.js defines computeChaos/compositeWithGlitch,
       script.js uses both. -->
  <script src="visualizers.js"></script>
  <script src="glitchfx.js"></script>
  <script src="script.js"></script>
</body>
</html>
